{% extends 'base.html' %}

{% block title %}Decommission {{ object.hostname }} | NetDevFlow{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg text-center">
            <div class="card-body p-5">
                <div class="mb-4">
                    <i class="fas fa-exclamation-triangle fa-4x text-danger"></i>
                </div>
                <h2 class="fw-bold mb-3">Confirm Decommission</h2>
                <p class="text-muted mb-4">
                    Are you sure you want to permanently delete <strong>{{ object.hostname }}</strong>? This action cannot be undone.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg">Confirm Deletion</button>
                        <a href="{% url 'device_detail' object.id %}" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
