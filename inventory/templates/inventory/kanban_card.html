<div class="kanban-card {% if ticket.severity == 'CRITICAL' %}critical{% elif ticket.severity == 'WARNING' %}warning{% else %}low{% endif %}" 
     data-id="{{ ticket.id }}">
    <div class="d-flex justify-content-between align-items-start mb-2">
        <span class="badge bg-light text-dark border small">#{{ ticket.id }}</span>
        {% if ticket.severity == 'CRITICAL' %}
            <i class="fas fa-exclamation-triangle text-danger" title="Critical Severity"></i>
        {% endif %}
    </div>
    
    <h6 class="fw-bold mb-1">{{ ticket.title }}</h6>
    <p class="text-muted small mb-3 text-truncate-2">
        {{ ticket.description|truncatewords:15 }}
    </p>
    
    <div class="d-flex justify-content-between align-items-center pt-2 border-top">
        <div class="small text-muted">
            <i class="fas fa-server me-1"></i> {{ ticket.device.hostname|default:"Quick Job" }}
        </div>
        {% if ticket.assigned_to %}
            <span class="badge rounded-pill bg-primary" title="Assigned to {{ ticket.assigned_to.username }}">
                {{ ticket.assigned_to.username|first|upper }}
            </span>
        {% else %}
            <i class="fas fa-user-clock text-muted" title="Unassigned"></i>
        {% endif %}
    </div>
    
    <a href="{% url 'ticket_update' ticket.id %}" class="stretched-link"></a>
</div>

<style>
    .text-truncate-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;  
        overflow: hidden;
    }
    .kanban-card { position: relative; }
    .kanban-card .stretched-link { z-index: 1; }
</style>
